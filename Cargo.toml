[package]
name = "dronoid"
version = "0.1.0"
authors = ["Primo <primo.contact@mail.fr>"]
edition = '2024'

[lib]
doctest = false
test = false

[[bin]]
name = "server"
test = false
doctest = false

[[test]]
name = "all"

[dependencies]
anyhow = "1.0.104"
bevy_app = "0.19.1"
bevy_ecs = "0.19.1"
colored = "3.1.1"
fern = "0.7.1"
futures = "0.3.34"
futures-util = "0.3.34"
log = "0.4.33"
multimap = "0.10.1"
rand = "0.10.2"
rapier2d = "0.35.2"
serde = {version = "1.0.229", features = ["derive"]}
serde_json = "1.0.151"
test-helpers = "0.2.3"
thiserror = "2.0.20"
tokio = {version = "1.53.1", features = ["full"]}
tokio-tungstenite = "0.30.0"
